<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>karly hou | home</title>
    <style>
        body {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1em;
            background: #000;
            overflow: hidden;
        }

        .home-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            background: #000;
        }

        .home-bg-image,
        .home-bg-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .home-bg-image {
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        .home-bg-video {
            opacity: 0;
            transition: opacity 2s ease;
        }

        .home-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0);
            pointer-events: none;
            transition: background 0.3s ease;
        }

        .home-bg.is-tinted::after {
            background: rgba(0, 0, 0, 0.28);
        }

        .fixed-links {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .fixed-link {
            text-decoration: none;
            color: white;
            position: absolute;
        }

        .fixed-link:hover {
            color: #FFD700;
        }

        /* Example positions for links */
        .link-name {
            top: 15%;
            left: 50%;
        }

        .link-name:hover {
            color:#dbdbdb;
        }

        .link-photo {
            top: 40%;
            left: 30%;
        }

        .link-photo:hover, .link-photo:visited {
            color: #fce803;
        }

        .link-art {
            top: 65%;
            left: 50%;
        }

        .link-art:hover, .link-art:visited {
            color: #fc5d88;
        }

        .link-writing {
            top: 70%;
            left: 20%;
        }

        .link-writing:hover, .link-writing:visited {
            color: #16f224;
        }

        .link-shelf {
            top: 80%;
            left: 75%;
        }

        .link-shelf:hover, .link-shelf:visited {
            color: #9794ff;
        }

        .link-research {
            top: 32%;
            left: 65%;
        }

        .link-research:hover, .link-research:visited {
            color:#a103fc;
        }

        .link-hidden1 {
            top: 20%;
            left: 10%;
            font-size: 3em;
        }

        .link-hidden1:hover, .link-hidden1:visited {
            color:#fc9803;
        }

        .link-hidden2 {
            top: 5%;
            left: 40%;
            font-size: 3em;
        }

        .link-hidden2:hover, .link-hidden2:visited {
            color:#03fcf4;
        }

        .link-hidden4 {
            top: 45%;
            left: 90%;
            font-size: 3em;
        }

        .link-hidden4:hover, .link-hidden4:visited {
            color:#a11220;
        }
    </style>
</head>

<body>
    <div class="home-bg" id="homeBg" aria-hidden="true"></div>
    <div class="fixed-links">
        <a href="index.html" class="fixed-link link-name">karly</a>
        <a href="photography.html" class="fixed-link link-photo">photo</a>
        <a href="art.html" class="fixed-link link-art">art</a>
        <a href="writing.html" class="fixed-link link-writing">writing</a>
        <a href="bookshelf.html" class="fixed-link link-shelf">shelf</a>

        <a href="https://karlyh66.github.io/cut-poems/" class="fixed-link link-hidden1">.</a>
        <a href="https://theharvardadvocate.com/content/ruminate" class="fixed-link link-hidden2">.</a>
        <a href="https://karlyh66.github.io/record-room/" class="fixed-link link-hidden4">.</a>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var backgrounds = [
                { type: 'image', src: 'bg/1.png' },
                { type: 'video', src: 'bg/2.MOV' },
                { type: 'video', src: 'bg/3.MOV' },
                { type: 'video', src: 'bg/4.mov' },
                { type: 'video', src: 'bg/5.mov' },
                { type: 'video', src: 'bg/6.mov' },
                { type: 'video', src: 'bg/7.mov' },
                { type: 'video', src: 'bg/8.MOV' },
                { type: 'video', src: 'bg/9.MOV' },
                { type: 'video', src: 'bg/10.MOV' },
                { type: 'video', src: 'bg/11.mov' },
                { type: 'video', src: 'bg/12.mov' },
                { type: 'video', src: 'bg/13.mov' },
                { type: 'image', src: 'bg/14.JPG' }
            ];

            var homeBg = document.getElementById('homeBg');
            var selected = backgrounds[Math.floor(Math.random() * backgrounds.length)];
            var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var tintedBackgrounds = ['bg/2.MOV', 'bg/4.mov', 'bg/6.mov'];

            if (tintedBackgrounds.indexOf(selected.src) !== -1) {
                homeBg.classList.add('is-tinted');
            }

            function showImage(src) {
                var image = document.createElement('div');
                image.className = 'home-bg-image';
                image.style.backgroundImage = "url('" + src + "')";
                homeBg.appendChild(image);
            }

            function showVideo(src) {
                if (src === 'bg/6.mov') {
                    showOneShotVideo(src);
                    return;
                }

                var videos = [document.createElement('video'), document.createElement('video')];
                var current = 0;
                var fadeSeconds = 2;
                var isFading = false;
                var fellBack = false;

                function fallBackToImage() {
                    if (fellBack) {
                        return;
                    }

                    fellBack = true;
                    homeBg.innerHTML = '';
                    showImage('bg/1.png');
                }

                videos.forEach(function (video, index) {
                    video.className = 'home-bg-video';
                    video.src = src;
                    video.muted = true;
                    video.playsInline = true;
                    video.preload = 'auto';
                    video.setAttribute('muted', '');
                    video.setAttribute('playsinline', '');
                    video.style.opacity = index === 0 ? '1' : '0';
                    video.addEventListener('error', fallBackToImage);
                    homeBg.appendChild(video);
                });

                videos.forEach(function (video) {
                    video.addEventListener('timeupdate', function () {
                        var active = videos[current];
                        var next = videos[1 - current];

                        if (video !== active || isFading || !active.duration) {
                            return;
                        }

                        if (active.duration - active.currentTime <= fadeSeconds) {
                            isFading = true;
                            next.currentTime = 0;
                            next.play().catch(fallBackToImage);
                            active.style.opacity = '0';
                            next.style.opacity = '1';

                            window.setTimeout(function () {
                                active.pause();
                                active.currentTime = 0;
                                current = 1 - current;
                                isFading = false;
                            }, fadeSeconds * 1000);
                        }
                    });
                });

                videos[0].play().catch(fallBackToImage);
            }

            function showOneShotVideo(src) {
                var video = document.createElement('video');
                var fellBack = false;

                function fallBackToImage() {
                    if (fellBack) {
                        return;
                    }

                    fellBack = true;
                    homeBg.innerHTML = '';
                    showImage('bg/1.png');
                }

                video.className = 'home-bg-video';
                video.src = src;
                video.muted = true;
                video.playsInline = true;
                video.preload = 'auto';
                video.setAttribute('muted', '');
                video.setAttribute('playsinline', '');
                video.addEventListener('error', fallBackToImage);
                video.addEventListener('canplay', function () {
                    video.style.opacity = '1';
                });
                homeBg.appendChild(video);

                video.play().catch(fallBackToImage);
            }

            if (selected.type === 'video' && !reduceMotion) {
                showVideo(selected.src);
            } else {
                showImage(selected.type === 'image' ? selected.src : 'bg/1.png');
            }
        });
    </script>
</body>
</html>
